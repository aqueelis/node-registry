name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        
        env:
          AWS_REGION: us-east-1
          ECR_REPOSITORY: my-ecr-repo
          ECS_CLUSTER: my-ecs-cluster
          ECS_SERVICE: my-ecs-service
          IMAGE_TAG: ${{ github.sha }}
          APP_VERSION: v1.0.${{ github.run_number }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Lint Python
          run: |
            python -m pip install --upgrade pip
            pip install flake8
            flake8 app/
        
        - name: Login to Amazon ECR
          run: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        
        - name: Build Docker image
          run: |
            docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} --build-arg APP_VERSION=${{ env.APP_VERSION }} .
        
        - name: Push Docker image to ECR
          run: |
            docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

        - name: Deploy to ECS
          run: |
            TASK_DEF = $(aws ecs describe-task-definition --task-definition ${{ env.ECS_SERVICE }} --query 'taskDefinition')
            NEW_TASK_DEF = $(echo $TASK_DEF | jq --arg IMAGE "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" '.containerDefinitions[0].image = $IMAGE')

            echo $NEW_TASK_DEF > new-task-def.json
            aws ecs register-task-definition --cli-input-json file://new-task-def.json

            aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment